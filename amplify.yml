# AWS Amplify Hosting build spec (Next.js SSR / "WEB_COMPUTE" platform).
# Route handlers under /api run on Amplify's managed, Lambda-backed compute – no always-on servers.
version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 22 || true
        - npm ci --legacy-peer-deps
    build:
      commands:
        # Server-side secrets are only exposed to the SSR runtime via .env.production (never NEXT_PUBLIC_*)
        - env | grep -E '^(RUN_TOKEN_SECRET|APP_STAGE|DDB_TABLE_NAME|AWS_REGION)=' >> .env.production || true
        - npm run assets:check
        - npm run typecheck
        - npm test
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
